name: ascend
description: "Ascend: registro local de entrenamientos de gimnasio (100 % offline)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  generate: true # gen-l10n (l10n.yaml)

  assets:
    - assets/images/streak/
