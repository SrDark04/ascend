name: ascend
description: "Ascend: registro local de entrenamientos de gimnasio (100 % offline)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  logger: ^2.8.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  alchemist: ^0.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  generate: true # gen-l10n (l10n.yaml)

  assets:
    - assets/images/streak/
    - assets/fonts/BarlowCondensed/OFL.txt
    - assets/fonts/IBMPlexSans/OFL.txt
    - assets/fonts/IBMPlexMono/OFL.txt

  # Fuentes empaquetadas (OFL, §7.3). Sin descargas en tiempo de ejecución.
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          weight: 500
